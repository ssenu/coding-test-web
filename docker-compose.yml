# 실행: cp .env.example .env (값 채우기) → docker compose up -d --build → http://localhost:8080
# 서버에서는 docker-compose.override.yml(git에 없음)로 127.0.0.1의 포트에만 연다.
name: coding-test-web

services:
  app:
    build: .
    image: coding-test-web
    ports:
      - '8080:8080'
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
